name: Build Offline Forest Radio APK v2.4

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate Forest Radio Project v2.4
        run: |
          python3 - << 'EOF'
          import os
          import textwrap

          files = {
              "settings.gradle": r"""
                  pluginManagement {
                      repositories {
                          google()
                          mavenCentral()
                          gradlePluginPortal()
                      }
                  }
                  dependencyResolutionManagement {
                      repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
                      repositories {
                          google()
                          mavenCentral()
                      }
                  }
                  rootProject.name = "ForestRadio"
                  include ':app'
              """,

              "build.gradle": r"""
                  plugins {
                      id 'com.android.application' version '8.1.4' apply false
                  }
              """,

              "gradle.properties": r"""
                  org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
                  android.useAndroidX=true
                  android.nonTransitiveRClass=true
              """,

              "app/build.gradle": r"""
                  plugins {
                      id 'com.android.application'
                  }

                  android {
                      namespace 'com.example.forestradio'
                      compileSdk 34

                      defaultConfig {
                          applicationId "com.example.forestradio"
                          minSdk 26
                          targetSdk 34
                          versionCode 6
                          versionName "2.4"
                      }

                      buildTypes {
                          debug { }
                          release {
                              minifyEnabled false
                          }
                      }

                      compileOptions {
                          sourceCompatibility JavaVersion.VERSION_17
                          targetCompatibility JavaVersion.VERSION_17
                      }
                  }
              """,

              "app/src/main/AndroidManifest.xml": r"""
                  <?xml version="1.0" encoding="utf-8"?>
                  <manifest xmlns:android="http://schemas.android.com/apk/res/android">

                      <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
                      <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
                      <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
                      <uses-permission android:name="android.permission.CHANGE_WIFI_STATE" />
                      <uses-permission android:name="android.permission.NEARBY_WIFI_DEVICES" />
                      <uses-permission android:name="android.permission.RECORD_AUDIO" />
                      <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
                      <uses-permission android:name="android.permission.INTERNET" />

                      <application
                          android:allowBackup="true"
                          android:label="Forest Radio"
                          android:icon="@android:drawable/ic_btn_speak_now"
                          android:theme="@android:style/Theme.Material.NoActionBar">

                          <activity
                              android:name=".MainActivity"
                              android:configChanges="orientation|screenSize|keyboardHidden"
                              android:exported="true">
                              <intent-filter>
                                  <action android:name="android.intent.action.MAIN" />
                                  <category android:name="android.intent.category.LAUNCHER" />
                              </intent-filter>
                          </activity>

                      </application>
                  </manifest>
              """,

              "app/src/main/res/layout/activity_main.xml": r"""
                  <?xml version="1.0" encoding="utf-8"?>
                  <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
                      android:layout_width="match_parent"
                      android:layout_height="match_parent"
                      android:orientation="vertical"
                      android:background="#1b2e1b"
                      android:gravity="center"
                      android:padding="20dp">

                      <TextView
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="Offline Forest Radio (v2.4)"
                          android:textColor="#a3e4d7"
                          android:textSize="20sp"
                          android:textStyle="bold"
                          android:paddingBottom="6dp" />

                      <TextView
                          android:id="@+id/tv_status"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:text="เปิด Wi-Fi และ GPS ก่อนใช้งาน&#10;(เครื่องแม่กดปุ่ม 1 / เครื่องลูกกดปุ่ม 2)"
                          android:textColor="#f9e79f"
                          android:textSize="14sp"
                          android:paddingBottom="18dp"
                          android:gravity="center" />

                      <Button
                          android:id="@+id/btn_host"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:text="1. สร้างห้อง (เครื่องแม่ข่าย)"
                          android:backgroundTint="#117a65"
                          android:textColor="#ffffff"
                          android:layout_marginBottom="10dp" />

                      <Button
                          android:id="@+id/btn_discover"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:text="2. ค้นหาและเกาะกลุ่ม (เครื่องลูกข่าย)"
                          android:backgroundTint="#2874a6"
                          android:textColor="#ffffff"
                          android:layout_marginBottom="10dp" />

                      <Button
                          android:id="@+id/btn_reset"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:text="ล้างสถานะ / รีเซ็ตการเชื่อมต่อ"
                          android:backgroundTint="#566573"
                          android:textColor="#ffffff"
                          android:layout_marginBottom="24dp" />

                      <Button
                          android:id="@+id/btn_ptt"
                          android:layout_width="190dp"
                          android:layout_height="190dp"
                          android:text="กดค้างเพื่อพูด"
                          android:textSize="18sp"
                          android:textStyle="bold"
                          android:textColor="#ffffff"
                          android:backgroundTint="#c0392b" />

                  </LinearLayout>
              """,

              "app/src/main/java/com/example/forestradio/MainActivity.java": r"""
                  package com.example.forestradio;

                  import android.Manifest;
                  import android.annotation.SuppressLint;
                  import android.app.Activity;
                  import android.content.BroadcastReceiver;
                  import android.content.Context;
                  import android.content.Intent;
                  import android.content.IntentFilter;
                  import android.content.pm.PackageManager;
                  import android.media.AudioFormat;
                  import android.media.AudioManager;
                  import android.media.AudioRecord;
                  import android.media.AudioTrack;
                  import android.media.MediaRecorder;
                  import android.net.wifi.p2p.WifiP2pConfig;
                  import android.net.wifi.p2p.WifiP2pDevice;
                  import android.net.wifi.p2p.WifiP2pInfo;
                  import android.net.wifi.p2p.WifiP2pManager;
                  import android.os.Build;
                  import android.os.Bundle;
                  import android.view.MotionEvent;
                  import android.widget.Button;
                  import android.widget.TextView;

                  import java.io.IOException;
                  import java.net.DatagramPacket;
                  import java.net.DatagramSocket;
                  import java.net.InetAddress;
                  import java.util.ArrayList;
                  import java.util.List;

                  public class MainActivity extends Activity {
                      private WifiP2pManager manager;
                      private WifiP2pManager.Channel channel;
                      private BroadcastReceiver receiver;
                      private IntentFilter intentFilter;

                      private TextView tvStatus;
                      private Button btnHost, btnDiscover, btnReset, btnPtt;

                      private final List<WifiP2pDevice> peers = new ArrayList<>();
                      private WifiP2pInfo p2pInfo;
                      private volatile boolean isConnected = false;
                      private volatile boolean isConnecting = false;
                      private volatile boolean autoConnectWanted = false;
                      private volatile InetAddress lastPeerAddress = null;

                      private static final int SAMPLE_RATE = 8000;
                      private static final int CHANNEL_CONFIG = AudioFormat.CHANNEL_IN_MONO;
                      private static final int AUDIO_FORMAT = AudioFormat.ENCODING_PCM_16BIT;
                      private volatile boolean isRecording = false;
                      private volatile boolean isRunning = true;
                      private Thread audioReceiverThread;
                      private DatagramSocket udpSocket;
                      private static final int PORT = 50005;

                      @SuppressLint("ClickableViewAccessibility")
                      @Override
                      protected void onCreate(Bundle savedInstanceState) {
                          super.onCreate(savedInstanceState);
                          setContentView(R.layout.activity_main);

                          tvStatus = findViewById(R.id.tv_status);
                          btnHost = findViewById(R.id.btn_host);
                          btnDiscover = findViewById(R.id.btn_discover);
                          btnReset = findViewById(R.id.btn_reset);
                          btnPtt = findViewById(R.id.btn_ptt);

                          requestRequiredPermissions();

                          manager = (WifiP2pManager) getSystemService(Context.WIFI_P2P_SERVICE);
                          if (manager != null) {
                              channel = manager.initialize(this, getMainLooper(), null);
                          }

                          intentFilter = new IntentFilter();
                          intentFilter.addAction(WifiP2pManager.WIFI_P2P_STATE_CHANGED_ACTION);
                          intentFilter.addAction(WifiP2pManager.WIFI_P2P_PEERS_CHANGED_ACTION);
                          intentFilter.addAction(WifiP2pManager.WIFI_P2P_CONNECTION_CHANGED_ACTION);

                          btnHost.setOnClickListener(v -> createHostGroup());
                          btnDiscover.setOnClickListener(v -> discoverAndJoin());
                          btnReset.setOnClickListener(v -> resetP2pState());

                          btnPtt.setOnTouchListener((v, event) -> {
                              if (event.getAction() == MotionEvent.ACTION_DOWN) {
                                  if (isConnected) {
                                      btnPtt.setText("กำลังพูด...");
                                      startStreamingAudio();
                                  } else {
                                      tvStatus.setText("ยังไม่ได้เชื่อมต่อกลุ่ม (กรุณาเชื่อมต่อก่อน)");
                                  }
                                  return true;
                              } else if (event.getAction() == MotionEvent.ACTION_UP || event.getAction() == MotionEvent.ACTION_CANCEL) {
                                  if (isRecording) {
                                      stopStreamingAudio();
                                      btnPtt.setText("กดค้างเพื่อพูด");
                                  }
                                  return true;
                              }
                              return false;
                          });

                          startAudioReceiver();
                      }

                      private void requestRequiredPermissions() {
                          List<String> perms = new ArrayList<>();
                          perms.add(Manifest.permission.ACCESS_FINE_LOCATION);
                          perms.add(Manifest.permission.ACCESS_COARSE_LOCATION);
                          perms.add(Manifest.permission.RECORD_AUDIO);
                          if (Build.VERSION.SDK_INT >= 33) {
                              perms.add(Manifest.permission.NEARBY_WIFI_DEVICES);
                          }
                          requestPermissions(perms.toArray(new String[0]), 101);
                      }

                      private boolean hasWifiP2pPermission() {
                          if (Build.VERSION.SDK_INT >= 33) {
                              return checkSelfPermission(Manifest.permission.NEARBY_WIFI_DEVICES) == PackageManager.PERMISSION_GRANTED
                                      || checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION) == PackageManager.PERMISSION_GRANTED;
                          }
                          return checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION) == PackageManager.PERMISSION_GRANTED;
                      }

                      private String reasonText(int reason) {
                          if (reason == WifiP2pManager.P2P_UNSUPPORTED) return "อุปกรณ์ไม่รองรับ P2P (1)";
                          if (reason == WifiP2pManager.BUSY) return "ระบบไม่ว่าง / กรุณาเปิด Wi-Fi & GPS หรือกดรีเซ็ต (2)";
                          return "ข้อผิดพลาดภายใน (" + reason + ")";
                      }

                      @SuppressLint("MissingPermission")
                      private void createHostGroup() {
                          if (manager == null || channel == null) return;
                          if (!hasWifiP2pPermission()) {
                              tvStatus.setText("กรุณาอนุญาตสิทธิ์ Location / Nearby ก่อน");
                              requestRequiredPermissions();
                              return;
                          }
                          autoConnectWanted = false;
                          isConnecting = false;
                          tvStatus.setText("กำลังสร้างห้องแม่ข่าย...");
                          manager.removeGroup(channel, new WifiP2pManager.ActionListener() {
                              @Override public void onSuccess() { doCreateGroup(); }
                              @Override public void onFailure(int reason) { doCreateGroup(); }
                          });
                      }

                      @SuppressLint("MissingPermission")
                      private void doCreateGroup() {
                          manager.createGroup(channel, new WifiP2pManager.ActionListener() {
                              @Override
                              public void onSuccess() {
                                  tvStatus.setText("สร้างห้องสำเร็จ! รอเครื่องลูกข่ายกดปุ่ม 2...");
                              }
                              @Override
                              public void onFailure(int reason) {
                                  tvStatus.setText("สร้างห้องไม่สำเร็จ: " + reasonText(reason));
                              }
                          });
                      }

                      @SuppressLint("MissingPermission")
                      private void discoverAndJoin() {
                          if (manager == null || channel == null) return;
                          if (!hasWifiP2pPermission()) {
                              tvStatus.setText("กรุณาอนุญาตสิทธิ์ Location / Nearby ก่อน");
                              requestRequiredPermissions();
                              return;
                          }
                          autoConnectWanted = true;
                          isConnecting = false;
                          tvStatus.setText("กำลังค้นหาเครื่องแม่ข่าย...");
                          manager.discoverPeers(channel, new WifiP2pManager.ActionListener() {
                              @Override
                              public void onSuccess() {
                                  tvStatus.setText("กำลังสแกนหาอุปกรณ์รอบข้าง...");
                              }
                              @Override
                              public void onFailure(int reason) {
                                  tvStatus.setText("ค้นหาไม่สำเร็จ: " + reasonText(reason));
                              }
                          });
                      }

                      @SuppressLint("MissingPermission")
                      private void resetP2pState() {
                          if (manager == null || channel == null) return;
                          autoConnectWanted = false;
                          isConnecting = false;
                          isConnected = false;
                          lastPeerAddress = null;
                          manager.cancelConnect(channel, null);
                          manager.stopPeerDiscovery(channel, null);
                          manager.removeGroup(channel, new WifiP2pManager.ActionListener() {
                              @Override
                              public void onSuccess() {
                                  tvStatus.setText("ล้างสถานะเรียบร้อย พร้อมเริ่มใหม่");
                              }
                              @Override
                              public void onFailure(int reason) {
                                  tvStatus.setText("รีเซ็ตระบบแล้ว พร้อมเริ่มใหม่");
                              }
                          });
                      }

                      private final WifiP2pManager.PeerListListener peerListListener = peerList -> {
                          peers.clear();
                          peers.addAll(peerList.getDeviceList());
                          if (peers.isEmpty()) {
                              if (!isConnected) tvStatus.setText("ยังไม่พบอุปกรณ์รอบตัว (ตรวจดูว่าเปิด Wi-Fi และ GPS แล้ว)");
                              return;
                          }

                          for (WifiP2pDevice dev : peers) {
                              if (dev.status == WifiP2pDevice.CONNECTED) {
                                  isConnected = true;
                                  isConnecting = false;
                                  tvStatus.setText("เชื่อมต่อกับ " + dev.deviceName + " แล้ว!");
                                  return;
                              }
                              if (dev.status == WifiP2pDevice.INVITED) {
                                  isConnecting = true;
                                  tvStatus.setText("รอการตอบรับจาก " + dev.deviceName + " (กดยอมรับบนหน้าจออีกเครื่อง)...");
                                  return;
                              }
                          }

                          WifiP2pDevice target = peers.get(0);
                          if (autoConnectWanted && !isConnected && !isConnecting && target.status == WifiP2pDevice.AVAILABLE) {
                              connectToDevice(target);
                          } else if (!isConnected) {
                              tvStatus.setText("พบอุปกรณ์: " + target.deviceName);
                          }
                      };

                      @SuppressLint("MissingPermission")
                      private void connectToDevice(WifiP2pDevice device) {
                          if (manager == null || channel == null || !hasWifiP2pPermission()) return;
                          isConnecting = true;
                          autoConnectWanted = false;
                          WifiP2pConfig config = new WifiP2pConfig();
                          config.deviceAddress = device.deviceAddress;

                          manager.stopPeerDiscovery(channel, new WifiP2pManager.ActionListener() {
                              @Override public void onSuccess() { initiateConnect(config, device.deviceName); }
                              @Override public void onFailure(int r) { initiateConnect(config, device.deviceName); }
                          });
                      }

                      @SuppressLint("MissingPermission")
                      private void initiateConnect(WifiP2pConfig config, String name) {
                          manager.connect(channel, config, new WifiP2pManager.ActionListener() {
                              @Override
                              public void onSuccess() {
                                  tvStatus.setText("ส่งคำขอไปที่ " + name + " แล้ว (กรุณากดยอมรับที่เครื่องปลายทาง)");
                              }
                              @Override
                              public void onFailure(int reason) {
                                  isConnecting = false;
                                  tvStatus.setText("เชื่อมต่อล้มเหลว: " + reasonText(reason));
                              }
                          });
                      }

                      private final WifiP2pManager.ConnectionInfoListener connectionInfoListener = info -> {
                          p2pInfo = info;
                          if (info != null && info.groupFormed) {
                              isConnected = true;
                              isConnecting = false;
                              autoConnectWanted = false;
                              String role = info.isGroupOwner ? "แม่ข่าย (Host)" : "ลูกข่าย (Client)";
                              tvStatus.setText("เชื่อมต่อสำเร็จ! สถานะ: " + role + " - กดปุ่มสีแดงค้างเพื่อพูดได้เลย");
                          } else {
                              isConnected = false;
                          }
                      };

                      @SuppressLint("MissingPermission")
                      private void startStreamingAudio() {
                          if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                              tvStatus.setText("ยังไม่ได้อนุญาตสิทธิ์ไมโครโฟน");
                              return;
                          }
                          isRecording = true;
                          new Thread(() -> {
                              android.os.Process.setThreadPriority(android.os.Process.THREAD_PRIORITY_AUDIO);
                              int minBuf = AudioRecord.getMinBufferSize(SAMPLE_RATE, CHANNEL_CONFIG, AUDIO_FORMAT);
                              int bufferSize = Math.max(minBuf, 640);
                              AudioRecord recorder = new AudioRecord(MediaRecorder.AudioSource.MIC, SAMPLE_RATE, CHANNEL_CONFIG, AUDIO_FORMAT, bufferSize);

                              byte[] buffer = new byte[640];
                              recorder.startRecording();

                              try (DatagramSocket socket = new DatagramSocket()) {
                                  socket.setBroadcast(true);
                                  InetAddress targetInet;
                                  if (p2pInfo != null && !p2pInfo.isGroupOwner && p2pInfo.groupOwnerAddress != null) {
                                      targetInet = p2pInfo.groupOwnerAddress;
                                  } else if (lastPeerAddress != null) {
                                      targetInet = lastPeerAddress;
                                  } else {
                                      targetInet = InetAddress.getByName("192.168.49.255");
                                  }

                                  while (isRecording) {
                                      int bytesRead = recorder.read(buffer, 0, buffer.length);
                                      if (bytesRead > 0) {
                                          DatagramPacket packet = new DatagramPacket(buffer, bytesRead, targetInet, PORT);
                                          socket.send(packet);
                                      }
                                  }
                              } catch (IOException ignored) {
                              } finally {
                                  try { recorder.stop(); } catch (Exception ignored) { }
                                  recorder.release();
                              }
                          }).start();
                      }

                      private void stopStreamingAudio() {
                          isRecording = false;
                      }

                      @SuppressWarnings("deprecation")
                      private void startAudioReceiver() {
                          audioReceiverThread = new Thread(() -> {
                              AudioTrack track = null;
                              try {
                                  udpSocket = new DatagramSocket(PORT);
                                  byte[] buffer = new byte[1024];
                                  int trackBufSize = Math.max(AudioTrack.getMinBufferSize(SAMPLE_RATE, AudioFormat.CHANNEL_OUT_MONO, AUDIO_FORMAT), 1024);
                                  track = new AudioTrack(
                                          AudioManager.STREAM_MUSIC,
                                          SAMPLE_RATE,
                                          AudioFormat.CHANNEL_OUT_MONO,
                                          AUDIO_FORMAT,
                                          trackBufSize,
                                          AudioTrack.MODE_STREAM
                                  );
                                  track.play();

                                  while (isRunning) {
                                      DatagramPacket packet = new DatagramPacket(buffer, buffer.length);
                                      udpSocket.receive(packet);
                                      if (packet.getAddress() != null && !packet.getAddress().isLoopbackAddress()) {
                                          lastPeerAddress = packet.getAddress();
                                      }
                                      if (!isRecording) {
                                          track.write(packet.getData(), 0, packet.getLength());
                                      }
                                  }
                              } catch (IOException ignored) {
                              } finally {
                                  if (track != null) {
                                      try { track.stop(); } catch (Exception ignored) { }
                                      track.release();
                                  }
                              }
                          });
                          audioReceiverThread.start();
                      }

                      @SuppressLint("MissingPermission")
                      @Override
                      protected void onResume() {
                          super.onResume();
                          receiver = new BroadcastReceiver() {
                              @Override
                              public void onReceive(Context context, Intent intent) {
                                  String action = intent.getAction();
                                  if (WifiP2pManager.WIFI_P2P_STATE_CHANGED_ACTION.equals(action)) {
                                      int state = intent.getIntExtra(WifiP2pManager.EXTRA_WIFI_STATE, -1);
                                      if (state != WifiP2pManager.WIFI_P2P_STATE_ENABLED) {
                                          tvStatus.setText("กรุณาเปิดสวิตช์ Wi-Fi บนเครื่องก่อนใช้งาน");
                                      }
                                  } else if (WifiP2pManager.WIFI_P2P_PEERS_CHANGED_ACTION.equals(action)) {
                                      if (manager != null && hasWifiP2pPermission()) {
                                          manager.requestPeers(channel, peerListListener);
                                      }
                                  } else if (WifiP2pManager.WIFI_P2P_CONNECTION_CHANGED_ACTION.equals(action)) {
                                      if (manager != null) {
                                          manager.requestConnectionInfo(channel, connectionInfoListener);
                                      }
                                  }
                              }
                          };
                          registerReceiver(receiver, intentFilter);
                      }

                      @Override
                      protected void onPause() {
                          super.onPause();
                          if (receiver != null) {
                              unregisterReceiver(receiver);
                          }
                      }

                      @Override
                      protected void onDestroy() {
                          isRunning = false;
                          isRecording = false;
                          if (udpSocket != null && !udpSocket.isClosed()) {
                              udpSocket.close();
                          }
                          super.onDestroy();
                      }
                  }
              """
          }

          for path, content in files.items():
              full_path = os.path.join("ForestRadioProject", path)
              os.makedirs(os.path.dirname(full_path), exist_ok=True)
              clean_content = textwrap.dedent(content).lstrip() + "\n"
              with open(full_path, "w", encoding="utf-8") as f:
                  f.write(clean_content)

          print("Forest Radio Project v2.4 generated successfully!")
          EOF

      - name: Set up Gradle 8.4
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Build Debug APK
        working-directory: ./ForestRadioProject
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ForestRadio-v2.4-APK
          path: ForestRadioProject/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
