name: Build Offline Forest Radio APK v2.3

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate Forest Radio Project v2.3
        run: |
          python3 - << 'EOF'
          import os
          import textwrap

          files = {
              "settings.gradle": """
                  pluginManagement {
                      repositories {
                          google()
                          mavenCentral()
                          gradlePluginPortal()
                      }
                  }
                  dependencyResolutionManagement {
                      repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
                      repositories {
                          google()
                          mavenCentral()
                      }
                  }
                  rootProject.name = "ForestRadio"
                  include ':app'
              """,

              "build.gradle": """
                  plugins {
                      id 'com.android.application' version '8.1.4' apply false
                  }
              """,

              "gradle.properties": """
                  org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
                  android.useAndroidX=true
                  android.nonTransitiveRClass=true
              """,

              "app/build.gradle": """
                  plugins {
                      id 'com.android.application'
                  }

                  android {
                      namespace 'com.example.forestradio'
                      compileSdk 34

                      defaultConfig {
                          applicationId "com.example.forestradio"
                          minSdk 26
                          targetSdk 34
                          versionCode 5
                          versionName "2.3"
                      }

                      buildTypes {
                          debug { }
                          release {
                              minifyEnabled false
                          }
                      }

                      compileOptions {
                          sourceCompatibility JavaVersion.VERSION_17
                          targetCompatibility JavaVersion.VERSION_17
                      }
                  }
              """,

              "app/src/main/AndroidManifest.xml": """
                  <?xml version="1.0" encoding="utf-8"?>
                  <manifest xmlns:android="http://schemas.android.com/apk/res/android">

                      <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
                      <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
                      <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
                      <uses-permission android:name="android.permission.CHANGE_WIFI_STATE" />
                      <uses-permission android:name="android.permission.NEARBY_WIFI_DEVICES" />
                      <uses-permission android:name="android.permission.RECORD_AUDIO" />
                      <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
                      <uses-permission android:name="android.permission.INTERNET" />

                      <application
                          android:allowBackup="true"
                          android:label="Forest Radio"
                          android:icon="@android:drawable/ic_btn_speak_now"
                          android:theme="@android:style/Theme.Material.NoActionBar">

                          <activity
                              android:name=".MainActivity"
                              android:configChanges="orientation|screenSize|keyboardHidden"
                              android:exported="true">
                              <intent-filter>
                                  <action android:name="android.intent.action.MAIN" />
                                  <category android:name="android.intent.category.LAUNCHER" />
                              </intent-filter>
                          </activity>

                      </application>
                  </manifest>
              """,

              "app/src/main/res/layout/activity_main.xml": """
                  <?xml version="1.0" encoding="utf-8"?>
                  <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
                      android:layout_width="match_parent"
                      android:layout_height="match_parent"
                      android:orientation="vertical"
                      android:background="#1b2e1b"
                      android:gravity="center"
                      android:padding="24dp">

                      <TextView
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="Offline Forest Radio (v2.3)"
                          android:textColor="#a3e4d7"
                          android:textSize="20sp"
                          android:textStyle="bold"
                          android:paddingBottom="8dp" />

                      <TextView
                          android:id="@+id/tv_status"
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="สถานะ: พร้อมเชื่อมต่อ Wi-Fi Direct"
                          android:textColor="#f9e79f"
                          android:textSize="14sp"
                          android:paddingBottom="24dp"
                          android:gravity="center" />

                      <Button
                          android:id="@+id/btn_discover"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:text="1. ค้นหาและสร้างกลุ่ม Wi-Fi P2P"
                          android:backgroundTint="#117a65"
                          android:textColor="#ffffff"
                          android:layout_marginBottom="30dp" />

                      <Button
                          android:id="@+id/btn_ptt"
                          android:layout_width="200dp"
                          android:layout_height="200dp"
                          android:text="กดค้างเพื่อพูด"
                          android:textSize="18sp"
                          android:textStyle="bold"
                          android:textColor="#ffffff"
                          android:backgroundTint="#c0392b" />

                  </LinearLayout>
              """,

              "app/src/main/java/com/example/forestradio/MainActivity.java": """
                  package com.example.forestradio;

                  import android.Manifest;
                  import android.annotation.SuppressLint;
                  import android.app.Activity;
                  import android.content.BroadcastReceiver;
                  import android.content.Context;
                  import android.content.Intent;
                  import android.content.IntentFilter;
                  import android.content.pm.PackageManager;
                  import android.media.AudioFormat;
                  import android.media.AudioManager;
                  import android.media.AudioRecord;
                  import android.media.AudioTrack;
                  import android.media.MediaRecorder;
                  import android.net.wifi.p2p.WifiP2pConfig;
                  import android.net.wifi.p2p.WifiP2pDevice;
                  import android.net.wifi.p2p.WifiP2pInfo;
                  import android.net.wifi.p2p.WifiP2pManager;
                  import android.os.Build;
                  import android.os.Bundle;
                  import android.view.MotionEvent;
                  import android.widget.Button;
                  import android.widget.TextView;

                  import java.io.IOException;
                  import java.net.DatagramPacket;
                  import java.net.DatagramSocket;
                  import java.net.InetAddress;
                  import java.util.ArrayList;
                  import java.util.List;

                  public class MainActivity extends Activity {
                      private WifiP2pManager manager;
                      private WifiP2pManager.Channel channel;
                      private BroadcastReceiver receiver;
                      private IntentFilter intentFilter;

                      private TextView tvStatus;
                      private Button btnDiscover, btnPtt;

                      private final List<WifiP2pDevice> peers = new ArrayList<>();
                      private WifiP2pInfo p2pInfo;
                      private volatile boolean isConnected = false;
                      private volatile InetAddress lastPeerAddress = null;

                      private static final int SAMPLE_RATE = 8000;
                      private static final int CHANNEL_CONFIG = AudioFormat.CHANNEL_IN_MONO;
                      private static final int AUDIO_FORMAT = AudioFormat.ENCODING_PCM_16BIT;
                      private volatile boolean isRecording = false;
                      private volatile boolean isRunning = true;
                      private Thread audioReceiverThread;
                      private DatagramSocket udpSocket;
                      private static final int PORT = 50005;

                      @SuppressLint("ClickableViewAccessibility")
                      @Override
                      protected void onCreate(Bundle savedInstanceState) {
                          super.onCreate(savedInstanceState);
                          setContentView(R.layout.activity_main);

                          tvStatus = findViewById(R.id.tv_status);
                          btnDiscover = findViewById(R.id.btn_discover);
                          btnPtt = findViewById(R.id.btn_ptt);

                          requestRequiredPermissions();

                          manager = (WifiP2pManager) getSystemService(Context.WIFI_P2P_SERVICE);
                          if (manager != null) {
                              channel = manager.initialize(this, getMainLooper(), null);
                          }

                          intentFilter = new IntentFilter();
                          intentFilter.addAction(WifiP2pManager.WIFI_P2P_STATE_CHANGED_ACTION);
                          intentFilter.addAction(WifiP2pManager.WIFI_P2P_PEERS_CHANGED_ACTION);
                          intentFilter.addAction(WifiP2pManager.WIFI_P2P_CONNECTION_CHANGED_ACTION);

                          btnDiscover.setOnClickListener(v -> discoverPeers());

                          btnPtt.setOnTouchListener((v, event) -> {
                              if (event.getAction() == MotionEvent.ACTION_DOWN) {
                                  if (isConnected) {
                                      btnPtt.setText("กำลังพูด...");
                                      startStreamingAudio();
                                  } else {
                                      tvStatus.setText("ยังไม่ได้เชื่อมต่อกลุ่ม");
                                  }
                                  return true;
                              } else if (event.getAction() == MotionEvent.ACTION_UP || event.getAction() == MotionEvent.ACTION_CANCEL) {
                                  if (isRecording) {
                                      stopStreamingAudio();
                                      btnPtt.setText("กดค้างเพื่อพูด");
                                  }
                                  return true;
                              }
                              return false;
                          });

                          startAudioReceiver();
                      }

                      private void requestRequiredPermissions() {
                          List<String> perms = new ArrayList<>();
                          perms.add(Manifest.permission.ACCESS_FINE_LOCATION);
                          perms.add(Manifest.permission.ACCESS_COARSE_LOCATION);
                          perms.add(Manifest.permission.RECORD_AUDIO);
                          if (Build.VERSION.SDK_INT >= 33) {
                              perms.add(Manifest.permission.NEARBY_WIFI_DEVICES);
                          }
                          requestPermissions(perms.toArray(new String[0]), 101);
                      }

                      private boolean hasWifiP2pPermission() {
                          if (Build.VERSION.SDK_INT >= 33) {
                              return checkSelfPermission(Manifest.permission.NEARBY_WIFI_DEVICES) == PackageManager.PERMISSION_GRANTED
                                      || checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION) == PackageManager.PERMISSION_GRANTED;
                          }
                          return checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION) == PackageManager.PERMISSION_GRANTED;
                      }

                      @SuppressLint("MissingPermission")
                      private void discoverPeers() {
                          if (manager == null || channel == null) return;
                          if (!hasWifiP2pPermission()) {
                              tvStatus.setText("กรุณาอนุญาตสิทธิ์ Location / Nearby Devices ก่อน");
                              requestRequiredPermissions();
                              return;
                          }
                          manager.discoverPeers(channel, new WifiP2pManager.ActionListener() {
                              @Override
                              public void onSuccess() { tvStatus.setText("กำลังค้นหาอุปกรณ์..."); }
                              @Override
                              public void onFailure(int reason) { tvStatus.setText("ค้นหาไม่สำเร็จ (รหัส " + reason + ")"); }
                          });
                      }

                      private final WifiP2pManager.PeerListListener peerListListener = peerList -> {
                          peers.clear();
                          peers.addAll(peerList.getDeviceList());
                          if (!peers.isEmpty()) {
                              WifiP2pDevice target = peers.get(0);
                              tvStatus.setText("พบอุปกรณ์: " + target.deviceName);
                              if (!isConnected) {
                                  connectToDevice(target);
                              }
                          } else {
                              tvStatus.setText("ไม่พบอุปกรณ์รอบตัว");
                          }
                      };

                      @SuppressLint("MissingPermission")
                      private void connectToDevice(WifiP2pDevice device) {
                          if (manager == null || channel == null || !hasWifiP2pPermission()) return;
                          WifiP2pConfig config = new WifiP2pConfig();
                          config.deviceAddress = device.deviceAddress;
                          manager.connect(channel, config, new WifiP2pManager.ActionListener() {
                              @Override
                              public void onSuccess() { tvStatus.setText("กำลังเชื่อมต่อกับ " + device.deviceName + "..."); }
                              @Override
                              public void onFailure(int reason) { tvStatus.setText("เชื่อมต่อล้มเหลว (รหัส " + reason + ")"); }
                          });
                      }

                      private final WifiP2pManager.ConnectionInfoListener connectionInfoListener = info -> {
                          p2pInfo = info;
                          if (info != null && info.groupFormed) {
                              isConnected = true;
                              String role = info.isGroupOwner ? "Group Owner (แม่ข่าย)" : "Client (ลูกข่าย)";
                              tvStatus.setText("เชื่อมต่อสำเร็จ! (" + role + ") พร้อมใช้งาน");
                          }
                      };

                      @SuppressLint("MissingPermission")
                      private void startStreamingAudio() {
                          if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                              tvStatus.setText("ยังไม่ได้อนุญาตสิทธิ์ไมโครโฟน");
                              return;
                          }
                          isRecording = true;
                          new Thread(() -> {
                              android.os.Process.setThreadPriority(android.os.Process.THREAD_PRIORITY_AUDIO);
                              int minBuf = AudioRecord.getMinBufferSize(SAMPLE_RATE, CHANNEL_CONFIG, AUDIO_FORMAT);
                              int bufferSize = Math.max(minBuf, 640);
                              AudioRecord recorder = new AudioRecord(MediaRecorder.AudioSource.MIC, SAMPLE_RATE, CHANNEL_CONFIG, AUDIO_FORMAT, bufferSize);

                              byte[] buffer = new byte[640];
                              recorder.startRecording();

                              try (DatagramSocket socket = new DatagramSocket()) {
                                  socket.setBroadcast(true);
                                  InetAddress targetInet;
                                  if (p2pInfo != null && !p2pInfo.isGroupOwner && p2pInfo.groupOwnerAddress != null) {
                                      targetInet = p2pInfo.groupOwnerAddress;
                                  } else if (lastPeerAddress != null) {
                                      targetInet = lastPeerAddress;
                                  } else {
                                      targetInet = InetAddress.getByName("192.168.49.255");
                                  }

                                  while (isRecording) {
                                      int bytesRead = recorder.read(buffer, 0, buffer.length);
                                      if (bytesRead > 0) {
                                          DatagramPacket packet = new DatagramPacket(buffer, bytesRead, targetInet, PORT);
                                          socket.send(packet);
                                      }
                                  }
                              } catch (IOException ignored) {
                              } finally {
                                  try { recorder.stop(); } catch (Exception ignored) { }
                                  recorder.release();
                              }
                          }).start();
                      }

                      private void stopStreamingAudio() {
                          isRecording = false;
                      }

                      @SuppressWarnings("deprecation")
                      private void startAudioReceiver() {
                          audioReceiverThread = new Thread(() -> {
                              AudioTrack track = null;
                              try {
                                  udpSocket = new DatagramSocket(PORT);
                                  byte[] buffer = new byte[1024];
                                  int trackBufSize = Math.max(AudioTrack.getMinBufferSize(SAMPLE_RATE, AudioFormat.CHANNEL_OUT_MONO, AUDIO_FORMAT), 1024);
                                  track = new AudioTrack(
                                          AudioManager.STREAM_MUSIC,
                                          SAMPLE_RATE,
                                          AudioFormat.CHANNEL_OUT_MONO,
                                          AUDIO_FORMAT,
                                          trackBufSize,
                                          AudioTrack.MODE_STREAM
                                  );
                                  track.play();

                                  while (isRunning) {
                                      DatagramPacket packet = new DatagramPacket(buffer, buffer.length);
                                      udpSocket.receive(packet);
                                      if (packet.getAddress() != null && !packet.getAddress().isLoopbackAddress()) {
                                          lastPeerAddress = packet.getAddress();
                                      }
                                      if (!isRecording) {
                                          track.write(packet.getData(), 0, packet.getLength());
                                      }
                                  }
                              } catch (IOException ignored) {
                              } finally {
                                  if (track != null) {
                                      try { track.stop(); } catch (Exception ignored) { }
                                      track.release();
                                  }
                              }
                          });
                          audioReceiverThread.start();
                      }

                      @SuppressLint("MissingPermission")
                      @Override
                      protected void onResume() {
                          super.onResume();
                          receiver = new BroadcastReceiver() {
                              @Override
                              public void onReceive(Context context, Intent intent) {
                                  String action = intent.getAction();
                                  if (WifiP2pManager.WIFI_P2P_PEERS_CHANGED_ACTION.equals(action)) {
                                      if (manager != null && hasWifiP2pPermission()) {
                                          manager.requestPeers(channel, peerListListener);
                                      }
                                  } else if (WifiP2pManager.WIFI_P2P_CONNECTION_CHANGED_ACTION.equals(action)) {
                                      if (manager != null) {
                                          manager.requestConnectionInfo(channel, connectionInfoListener);
                                      }
                                  }
                              }
                          };
                          registerReceiver(receiver, intentFilter);
                      }

                      @Override
                      protected void onPause() {
                          super.onPause();
                          if (receiver != null) {
                              unregisterReceiver(receiver);
                          }
                      }

                      @Override
                      protected void onDestroy() {
                          isRunning = false;
                          isRecording = false;
                          if (udpSocket != null && !udpSocket.isClosed()) {
                              udpSocket.close();
                          }
                          super.onDestroy();
                      }
                  }
              """
          }

          for path, content in files.items():
              full_path = os.path.join("ForestRadioProject", path)
              os.makedirs(os.path.dirname(full_path), exist_ok=True)
              clean_content = textwrap.dedent(content).strip() + "\n"
              with open(full_path, "w", encoding="utf-8") as f:
                  f.write(clean_content)

          print("Forest Radio Project v2.3 generated successfully!")
          EOF

      - name: Set up Gradle 8.4
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Build Debug APK
        working-directory: ./ForestRadioProject
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ForestRadio-v2.3-APK
          path: ForestRadioProject/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
